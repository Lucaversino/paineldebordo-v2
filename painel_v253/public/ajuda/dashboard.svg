<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img"><title>Resumo da pescaria em uma tela</title><rect x="0" y="0" width="1000" height="540" rx="18" fill="#f5fafb"/><text x="40" y="62" fill="#153344" font-family="Arial,sans-serif" font-size="32" font-weight="bold">Resumo da pescaria em uma tela</text><rect x="40" y="130" width="920" height="115" rx="18" fill="#153344"/><text x="65" y="177" fill="#9de1d3" font-family="Arial,sans-serif" font-size="20" font-weight="bold">VIAGEM EM ANDAMENTO · EXEMPLO</text><text x="65" y="222" fill="white" font-family="Arial,sans-serif" font-size="28" font-weight="normal">Confira o barco e a viagem antes de lançar.</text><rect x="40" y="270" width="290" height="125" rx="18" fill="#e0efeb"/><text x="60" y="310" fill="#153344" font-family="Arial,sans-serif" font-size="21" font-weight="bold">CORVINA</text><text x="60" y="363" fill="#153344" font-family="Arial,sans-serif" font-size="34" font-weight="normal">600 kg</text><rect x="355" y="270" width="290" height="125" rx="18" fill="#e0efeb"/><text x="375" y="310" fill="#153344" font-family="Arial,sans-serif" font-size="21" font-weight="bold">MISTURA</text><text x="375" y="363" fill="#153344" font-family="Arial,sans-serif" font-size="34" font-weight="normal">40 kg</text><rect x="670" y="270" width="290" height="125" rx="18" fill="#e0efeb"/><text x="690" y="310" fill="#153344" font-family="Arial,sans-serif" font-size="21" font-weight="bold">DESCARTE</text><text x="690" y="363" fill="#153344" font-family="Arial,sans-serif" font-size="34" font-weight="normal">10 kg</text><text x="40" y="468" fill="#153344" font-family="Arial,sans-serif" font-size="25" font-weight="normal">Meta = objetivo da viagem. Captura = peso registrado.</text></svg>