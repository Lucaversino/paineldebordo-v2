<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img"><title>Mesmo mar. Dois tipos de informação.</title><rect x="0" y="0" width="1000" height="540" rx="18" fill="#f5fafb"/><text x="40" y="62" fill="#153344" font-family="Arial,sans-serif" font-size="32" font-weight="bold">Mesmo mar. Dois tipos de informação.</text><rect x="40" y="125" width="440" height="295" rx="18" fill="#e0efeb"/><rect x="520" y="125" width="440" height="295" rx="18" fill="#e1edf8"/><text x="65" y="174" fill="#153344" font-family="Arial,sans-serif" font-size="29" font-weight="bold">SATÉLITE</text><text x="545" y="174" fill="#153344" font-family="Arial,sans-serif" font-size="29" font-weight="bold">PREVISÃO</text><text x="65" y="231" fill="#153344" font-family="Arial,sans-serif" font-size="23" font-weight="normal">Estimativa da superfície</text><text x="65" y="277" fill="#153344" font-family="Arial,sans-serif" font-size="23" font-weight="normal">na data observada.</text><text x="65" y="323" fill="#153344" font-family="Arial,sans-serif" font-size="23" font-weight="normal">Confira: “Observado”.</text><text x="65" y="369" fill="#153344" font-family="Arial,sans-serif" font-size="23" font-weight="normal">Pode mostrar manchas locais.</text><text x="545" y="231" fill="#153344" font-family="Arial,sans-serif" font-size="23" font-weight="normal">Cálculo para os próximos dias.</text><text x="545" y="277" fill="#153344" font-family="Arial,sans-serif" font-size="23" font-weight="normal">Áreas da grade do modelo.</text><text x="545" y="323" fill="#153344" font-family="Arial,sans-serif" font-size="23" font-weight="normal">Confira: dia previsto.</text><text x="545" y="369" fill="#153344" font-family="Arial,sans-serif" font-size="23" font-weight="normal">Pode suavizar manchas locais.</text><text x="40" y="474" fill="#096d65" font-family="Arial,sans-serif" font-size="30" font-weight="bold">O valor previsto pode ser menor OU maior.</text><text x="40" y="513" fill="#153344" font-family="Arial,sans-serif" font-size="22" font-weight="normal">Compare posição, data, unidade e legenda. Não é medição a bordo.</text></svg>