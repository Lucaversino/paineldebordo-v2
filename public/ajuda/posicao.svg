<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img"><title>Graus e minutos: preserve todos os números</title><rect x="0" y="0" width="1000" height="540" rx="18" fill="#f5fafb"/><text x="40" y="62" fill="#153344" font-family="Arial,sans-serif" font-size="32" font-weight="bold">Graus e minutos: preserve todos os números</text><rect x="40" y="120" width="920" height="145" rx="18" fill="#e0efeb"/><text x="66" y="165" fill="#153344" font-family="Arial,sans-serif" font-size="20" font-weight="bold">LATITUDE · SUL</text><text x="66" y="225" fill="#153344" font-family="Arial,sans-serif" font-size="38" font-weight="normal">25°4719  →  25° 47,19′ S</text><rect x="40" y="285" width="920" height="145" rx="18" fill="#e1edf8"/><text x="66" y="330" fill="#153344" font-family="Arial,sans-serif" font-size="20" font-weight="bold">LONGITUDE · OESTE</text><text x="66" y="390" fill="#153344" font-family="Arial,sans-serif" font-size="38" font-weight="normal">48°0296  →  48° 02,96′ W</text><text x="40" y="485" fill="#153344" font-family="Arial,sans-serif" font-size="25" font-weight="normal">O zero antes do 2 faz parte da posição.</text></svg>